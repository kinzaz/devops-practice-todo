name: Todo CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Учебный сбой проверки после деплоя"
        type: boolean
        default: false

      component:
        description: "Какой компонент выпускать"
        type: choice
        options:
          - ui
          - backend
        default: ui

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test API
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build UI
        working-directory: frontend
        run: npm run build

      - name: Save UI build
        uses: actions/upload-artifact@v7
        with:
          name: todo-ui-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Package backend
        run: |
          git archive --format=tar.gz \
            -o backend.tar.gz HEAD app requirements.txt

      - name: Save backend package
        uses: actions/upload-artifact@v7
        with:
          name: todo-backend-${{ github.sha }}
          path: backend.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-ui:
    needs: test-and-build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.component == 'ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: todo-production-ui
      cancel-in-progress: false

    env:
      RELEASE_NAME: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Download tested UI build
        uses: actions/download-artifact@v8
        with:
          name: todo-ui-${{ github.sha }}
          path: ui

      - name: Prepare release
        run: |
          test -s ui/index.html
          printf '%s\n' "$GITHUB_SHA" > ui/release.txt
          chmod -R u=rwX,go=rX ui

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TODO_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TODO_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/todo_ci
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/todo_ci ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host todo-server
            HostName 201.34.142.215
            User deploy
            IdentityFile ~/.ssh/todo_ci
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Upload release
        run: |
          ssh todo-server \
            "mkdir -m 755 '/var/www/todo-releases/$RELEASE_NAME'"

          scp -r ui/. \
            "todo-server:/var/www/todo-releases/$RELEASE_NAME/"

      - name: Remember previous release
        id: previous
        run: |
          previous=$(ssh todo-server \
            'readlink -f /var/www/todo-releases/current')

          case "$previous" in
            /var/www/todo-releases/*) ;;
            *) echo "Unexpected release path"; exit 1 ;;
          esac

          printf 'path=%s\n' "$previous" >> "$GITHUB_OUTPUT"

      - name: Activate release
        id: activate
        run: |
          ssh todo-server bash -s -- "$RELEASE_NAME" <<'REMOTE'
          set -euo pipefail

          base=/var/www/todo-releases
          release="$base/$1"

          test -s "$release/index.html"

          printf 'Previous release: '
          readlink -f "$base/current"

          ln -s "$release" "$base/.current-$1"
          mv -Tf "$base/.current-$1" "$base/current"

          printf 'Active release: '
          readlink -f "$base/current"
          REMOTE

      - name: Verify deployment
        id: verify
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          deployed_sha=$(curl --fail --silent --show-error \
            --max-time 15 --retry 3 \
            "https://test-stand.fun/release.txt?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")

          test "$deployed_sha" = "$GITHUB_SHA"

          curl --fail --silent --show-error \
            --max-time 15 \
            https://test-stand.fun/api/todos > /dev/null

          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "Simulating a failed deployment check"
            exit 1
          fi

      - name: Roll back UI
        if: failure() && steps.activate.outcome == 'success' && steps.verify.outcome == 'failure'
        env:
          PREVIOUS_RELEASE: ${{ steps.previous.outputs.path }}
        run: |
          ssh todo-server bash -s -- \
            "$PREVIOUS_RELEASE" "$RELEASE_NAME" <<'REMOTE'
          set -euo pipefail

          base=/var/www/todo-releases
          previous=$1
          failed="$base/$2"

          test -s "$previous/index.html"
          test "$(readlink -f "$base/current")" = "$failed"

          ln -s "$previous" "$base/.rollback-$2"
          mv -Tf "$base/.rollback-$2" "$base/current"

          printf 'Restored release: '
          readlink -f "$base/current"
          REMOTE

          curl --fail --silent --show-error \
            --max-time 15 https://test-stand.fun/ > /dev/null

  prepare-backend:
    needs: test-and-build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.component == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: todo-production-backend
      cancel-in-progress: false

    env:
      RELEASE_NAME: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Download backend package
        uses: actions/download-artifact@v8
        with:
          name: todo-backend-${{ github.sha }}
          path: backend

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TODO_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TODO_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/todo_ci
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/todo_ci ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host todo-server
            HostName 201.34.142.215
            User deploy
            IdentityFile ~/.ssh/todo_ci
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Upload backend package
        run: |
          ssh todo-server \
            "mkdir -m 755 '/opt/todo/releases/$RELEASE_NAME'"

          scp backend/backend.tar.gz \
            "todo-server:/opt/todo/releases/$RELEASE_NAME/"

      - name: Prepare Python environment
        run: |
          ssh todo-server bash -s -- \
            "$RELEASE_NAME" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          umask 022

          release="/opt/todo/releases/$1"
          cd "$release"

          tar -xzf backend.tar.gz
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

          .venv/bin/python -c \
            "from app.main import app; print('Application import OK')"

          printf '%s\n' "$2" > revision.txt

          printf 'Prepared release: %s\n' "$release"
          printf 'Current release: '
          readlink -f /opt/todo/releases/current
          REMOTE